name: TAD Prettier One-Time Baseline
on:
  push:
    branches:
      - chore/prettier-baseline-pinned-20261121
    paths:
      - .github/workflows/tad-prettier-baseline-once.yml

# This one-off formatting job has no access to production credentials.
# Remove this workflow from the branch before opening the review PR.
permissions:
  contents: write

jobs:
  format-once:
    if: github.repository == 'tadtaxiadvertising/tad-dooh-platform' && github.ref == 'refs/heads/chore/prettier-baseline-pinned-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v3
        with:
          version: "10.34.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Validate immutable format baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "47d17c3e0155da45e21ee2e1ca17bb067cb3376d" HEAD
          test -z "$(git status --porcelain)"
          test "$GITHUB_REF_NAME" = "chore/prettier-baseline-pinned-20261121"
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply only pinned Prettier to TS and TSX
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx prettier@3.9.10 --write "apps/**/*.{ts,tsx}"
          if [ -d packages/ui/src ]; then
            pnpm dlx prettier@3.9.10 --write "packages/ui/src/**/*.{ts,tsx}"
          fi
          pnpm dlx prettier@3.9.10 --check "apps/**/*.{ts,tsx}"
          if [ -d packages/ui/src ]; then
            pnpm dlx prettier@3.9.10 --check "packages/ui/src/**/*.{ts,tsx}"
          fi
          git diff --check
      - name: Assert changes are format-only with TypeScript syntax trees
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          "use strict";
          const cp = require("node:child_process");
          const fs = require("node:fs");
          const ts = require("typescript");
          const changed = cp.execFileSync("git", ["diff", "--name-only", "-z"]).toString("utf8").split("\0").filter(Boolean);
          if (changed.length < 1 || changed.length > 120) throw new Error("Unexpected formatted file count: " + changed.length);
          const eligible = file => /^(apps\/|packages\/ui\/src\/).*\.(?:ts|tsx)$/.test(file);
          function shape(node) {
            if (ts.isParenthesizedExpression(node)) return shape(node.expression);
            const children = [];
            ts.forEachChild(node, child => children.push(shape(child)));
            // JSX whitespace can be reflowed by a formatter without
            // changing the JSX element/attribute structure or literal tokens.
            const value = ts.isJsxText(node)
              ? node.text.replace(/\s+/g, " ").trim()
              : typeof node.text === "string" ? node.text
              : ts.isIdentifier(node) ? String(node.escapedText) : null;
            return [node.kind, value, children];
          }
          for (const file of changed) {
            if (!eligible(file)) throw new Error("Out of scope file: " + file);
            const before = cp.execFileSync("git", ["show", "HEAD:" + file], { maxBuffer: 10 * 1024 * 1024 }).toString("utf8");
            const after = fs.readFileSync(file, "utf8");
            const mode = file.endsWith(".tsx") ? ts.ScriptKind.TSX : ts.ScriptKind.TS;
            const pre = ts.createSourceFile(file, before, ts.ScriptTarget.Latest, false, mode);
            const post = ts.createSourceFile(file, after, ts.ScriptTarget.Latest, false, mode);
            if (pre.parseDiagnostics.length !== post.parseDiagnostics.length) throw new Error("Parse diagnostics changed: " + file);
            if (JSON.stringify(shape(pre)) !== JSON.stringify(shape(post))) throw new Error("TypeScript AST changed (not format-only): " + file);
          }
          process.stdout.write("TAD_PRETTIER_AST_UNCHANGED count=" + changed.length + "\n");
          NODE
      - name: Commit formatting to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name="tad-format-ci" -c user.email="tad-format-ci@users.noreply.github.com" add -u -- apps packages/ui
          git -c user.name="tad-format-ci" -c user.email="tad-format-ci@users.noreply.github.com" commit -m "style(prettier): normalize TS/TSX whitespace (#434)"
          git push origin HEAD:refs/heads/chore/prettier-baseline-pinned-20261121
