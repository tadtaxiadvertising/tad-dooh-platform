name: Auth session cache format diagnostic (temporary)
on:
  push:
    branches:
      - security/bound-hash-supabase-session-cache-20261123
permissions:
  contents: read
jobs:
  prettier-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.34.9
      - name: Show pinned Prettier changes for auth session cache test
        run: |
          set -euo pipefail
          pnpm dlx prettier@3.9.10 --write apps/api/src/modules/auth/guards/supabase-auth-session-cache.spec.ts
          git diff -- apps/api/src/modules/auth/guards/supabase-auth-session-cache.spec.ts
