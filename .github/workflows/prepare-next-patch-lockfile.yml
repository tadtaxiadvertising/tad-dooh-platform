name: Prepare patched Next lockfile (one-time branch helper)
on:
  push:
    branches:
      - security/next-image-optimizer-patch-20261103
    paths:
      - ".github/workflows/prepare-next-patch-lockfile.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve-and-commit-lockfile:
    if: github.repository == 'tadtaxiadvertising/tad-dooh-platform' && github.ref == 'refs/heads/security/next-image-optimizer-patch-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched Next versions without lifecycle scripts
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
      - name: Verify manifest and lock consistency
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml','utf8');
          for (const ws of ['admin','advertiser','driver']) {
            const pkg = require('./apps/'+ws+'/package.json');
            if (pkg.dependencies.next !== '15.5.28') process.exit(1);
            const part = lock.split('\n  apps/'+ws+':\n')[1]?.split(/\n  [\w-]+(?:\/[\w-]+)?:\n/)[0] || '';
            if (!/next:\s*\n\s+specifier: 15\.5\.28\s*\n\s+version: 15\.5\.28/.test(part)) {
              console.error('Patched Next not resolved for', ws);
              process.exit(1);
            }
          }
          if (!lock.includes('next@15.5.28')) process.exit(1);
          NODE
      - name: Commit generated lockfile only to the isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git commit -m "chore(security): refresh Next 15.5.28 lockfile [generated]"
          git push origin HEAD:security/next-image-optimizer-patch-20261103
