name: Prepare security runtime dependency lockfile (temporary)
on:
  push:
    branches: [security/multer-redirects-high-20261103]
    paths:
      - ".github/workflows/prepare-runtime-security-lock.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'tadtaxiadvertising/tad-dooh-platform' && github.ref == 'refs/heads/security/multer-redirects-high-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact lockfile safely
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
      - name: Ensure runtime modules are patched in lockfile
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          for (const p of ['multer@2.5.0:', 'follow-redirects@1.16.2:']) {
            if (!lock.includes('\n  '+p)) { console.error('Expected patched package not resolved:',p); process.exit(1); }
          }
          if (/\n  multer@2\.[0-4]\.\d+:/.test(lock) || /\n  follow-redirects@1\.16\.[01]:/.test(lock)) {
            console.error('Unpatched multipart/redirect runtime dependency remains');
            process.exit(1);
          }
          NODE
      - name: Commit generated lockfile to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile synchronized."
            exit 0
          fi
          git commit -m "chore(security): resolve patched Multer and redirects lockfile [generated]"
          git push origin HEAD:security/multer-redirects-high-20261103
