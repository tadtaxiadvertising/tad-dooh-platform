name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    - name: Build the canonical API Dockerfile
      run: docker build . --file Dockerfile.api --tag tad-api:test
    - name: Build the canonical Admin Dockerfile
      run: docker build . --file Dockerfile.admin --tag tad-admin:test
    - name: Build the canonical Driver Dockerfile
      run: docker build . --file Dockerfile.driver --tag tad-driver:test
    - name: Build the canonical Player Dockerfile
      run: docker build . --file Dockerfile.player --tag tad-player:test
