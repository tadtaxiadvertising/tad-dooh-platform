name: Simulator Credential Safety
on:
  pull_request:
    paths:
      - "apps/tad-simulator/**"
      - "scripts/simulator-key-security.test.cjs"
      - ".github/workflows/simulator-credential-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-credential-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify fail-closed simulator startup
        run: node --test scripts/simulator-key-security.test.cjs
