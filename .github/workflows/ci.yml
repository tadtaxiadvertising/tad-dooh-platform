name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── GATES ───────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  PRISMA_SCHEMA: "apps/api/prisma/schema.prisma"

jobs:
  # ── 1. FORMAT & LINT ──────────────────────────────────────────────────────────
  format:
    name: Format & Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: |
          set -euo pipefail
          if [ -d packages/ui/src ]; then
            pnpm dlx prettier --check "packages/ui/src/**/*.{ts,tsx}"
          fi
          pnpm dlx prettier --check "apps/**/*.{ts,tsx}"

      - name: Lint (ESLint)
        run: |
          set -euo pipefail
          pnpm lint --max-warnings 0

  # ── 2. TYPECHECK ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (all workspaces)
        run: |
          set -euo pipefail
          for pkg in apps/* packages/*; do
            if [ -f "$pkg/tsconfig.json" ]; then
              echo "🔍 Typecheck: $pkg"
              pnpm exec tsc --noEmit --project "$pkg/tsconfig.json"
            elif [ -f "$pkg/package.json" ]; then
              echo "ℹ️ Typecheck skipped (no tsconfig.json): $pkg"
            fi
          done

  # ── 3. UNIT & INTEGRATION TESTS ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: |
          set -euo pipefail
          pnpm --filter api test -- --runInBand

      - name: Run e2e tests
        run: |
          set -euo pipefail
          if [ -d tests/e2e ]; then
            pnpm exec playwright test --reporter=dot
          else
            echo "No tests/e2e directory; Playwright E2E suite is not configured here."
          fi

  # ── 4. PRISMA SCHEMA VALIDATION ──────────────────────────────────────────────
  prisma:
    name: Prisma Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate schema
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_test_db"
        run: |
          set -euo pipefail
          test -f "$PRISMA_SCHEMA"
          pnpm exec prisma validate --schema "$PRISMA_SCHEMA"

      - name: Prisma generate clients
        run: |
          set -euo pipefail
          pnpm exec prisma generate --schema="$PRISMA_SCHEMA"

  # ── 5. SECURITY AUDIT ───────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: npm audit (high severity only)
        run: |
          set -euo pipefail
          pnpm audit --audit-level=high

      - name: TruffleHog secret scan
        run: |
          set -euo pipefail
          if ! command -v trufflehog &> /dev/null; then
            echo "TruffleHog is required for the security gate but is not installed." >&2
            exit 1
          fi
          trufflehog git file://. --no-verification --fail

  # ── 6. BUILD IMAGES IN ISOLATED RUNNERS ──────────────────────────────────────
  # Docker builds do not consume the monorepo's installed node_modules. Each
  # image gets a fresh runner so earlier image layers cannot exhaust the disk
  # before the Player build starts.
  build:
    name: Build Docker Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [format, typecheck, test, prisma, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: admin
            dockerfile: Dockerfile.admin
          - image: driver
            dockerfile: Dockerfile.driver
          - image: player
            dockerfile: Dockerfile.player
    steps:
      - uses: actions/checkout@v4

      - name: Inspect runner disk
        run: |
          df -h
          docker system df

      - name: Build Docker image
        run: docker build . --file "${{ matrix.dockerfile }}" --tag "tad-${{ matrix.image }}:test"

  # ── SUMMARY ──────────────────────────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-24.04
    needs: [format, typecheck, test, prisma, security, build]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "## 🚀 CI Quality Gates Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for job in format typecheck test prisma security build; do
            status=$(echo "${{ needs[job] }}" | tr '[:upper:]' '[:lower:]')
            echo "- **${job}**: ($status)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ contains(fromJSON(toJSON(needs.*.result)), 'failure') }}" == "true" ]; then
            echo "❌ **Some gates failed** — review logs before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **All quality gates passed** — safe to merge." >> $GITHUB_STEP_SUMMARY
          fi
