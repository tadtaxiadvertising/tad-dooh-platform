server {
    # Easypanel por defecto mapea internamente al puerto 80 en aplicaciones Docker estáticas/proxy
    listen 80;
    listen [::]:80;
    server_name _;

    # 1. Endpoint vitalicio para Easypanel (Evita el SIGQUIT)
    location /health {
        access_log off;
        add_header 'Content-Type' 'application/json';
        return 200 '{"status":"OK", "service":"tad-player-proxy"}';
    }

    # 2. Servir la PWA / Proxy al Player
    location / {
        # Si Next.js corre en el puerto 3000 del mismo entorno:
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Ajustes de timeout para evitar cortes por red lenta (3G en Taxis)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
