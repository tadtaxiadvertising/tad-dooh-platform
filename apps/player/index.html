<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAD DOOH Player</title>
  <!-- Sentry Catch — Tablet Player -->
  <script src="https://js.sentry-cdn.com/b786a0fa94eec198afb9e35ce84d16ea.min.js" crossorigin="anonymous"></script>
  <script>
    Sentry.onLoad(function () {
      Sentry.init({
        dsn: "https://b786a0fa94eec198afb9e35ce84d16ea@o4511114332143616.ingest.us.sentry.io/4511114334633984",
        integrations: [Sentry.browserTracingIntegration()],
        tracesSampleRate: 1.0,
      });
    });
  </script>
  <!-- Umami Analytics — Tablet Player -->
  <script async src="https://cloud.umami.is/script.js" data-website-id="f00863a7-7700-4e72-85ae-716f796edfc6"></script>
  <link rel="stylesheet" href="/player.css" />
</head>

<body>
  <!-- Main loop player, muted to bypass browser auto-play policies -->
  <video id="tad-player" autoplay muted webkit-playsinline disablepictureinpicture></video>

  <!-- Transición de Anunciante (5s Intermission) -->
  <div id="intermission-screen">
    <div
      class="intermission-content flex flex-col items-center justify-center h-full w-full bg-gradient-to-br from-gray-900 to-black text-white p-12">
      <div class="mb-10 text-center">
        <p id="intermission-brand-label" class="text-tad-yellow text-sm font-black uppercase tracking-[0.5em] mb-4">
          Próximo Anuncio</p>
        <h2 id="intermission-advertiser-name" class="text-5xl font-black tracking-tighter uppercase leading-tight">
          Cargando...</h2>
      </div>

      <div class="relative group">
        <div class="absolute -inset-12 bg-tad-yellow/10 blur-[100px] rounded-full animate-pulse-soft"></div>
        <div class="qr-frame">
          <img id="intermission-qr" src="" alt="Menu QR" class="w-[380px] h-[380px]" />
        </div>
      </div>

      <div class="mt-16 text-center max-w-2xl">
        <h3 class="text-2xl font-bold mb-4">Escanea para conocer más</h3>
        <p class="text-gray-400 text-lg">Descubre nuestro menú, contáctanos por WhatsApp y síguenos en redes sociales.
        </p>
      </div>

      <div id="intermission-timer-bar"
        class="fixed bottom-0 left-0 h-2 bg-tad-yellow w-0 transition-all duration-[5000ms] ease-linear"></div>
    </div>
  </div>


  <!-- TAD UI Toast Container -->
  <div id="tad-toast"
    class="fixed top-5 left-1/2 -translate-x-1/2 bg-rose-600/90 backdrop-blur-md text-white px-6 py-4 rounded-2xl shadow-[0_0_30px_rgba(225,29,72,0.4)] z-[9000] font-black uppercase text-[10px] tracking-[0.2em] transition-all duration-500 opacity-0 pointer-events-none scale-95 border-2 border-rose-400/50 flex items-center gap-3">
    <span id="tad-toast-msg">SISTEMA TAD</span>
  </div>

  <script>
    window.addEventListener('TAD_UI_TOAST', (e) => {
      const toast = document.getElementById('tad-toast');
      const msg = document.getElementById('tad-toast-msg');
      if (msg && toast) {
        msg.innerText = e.detail;
        toast.classList.remove('opacity-0', 'scale-95');
        toast.classList.add('opacity-100', 'scale-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100', 'scale-100');
          toast.classList.add('opacity-0', 'scale-95');
        }, 8000);
      }
    });
  </script>

  <!-- Entry script loaded conditionally per Vite standard -->
  <script type="module" src="/index.ts"></script>
</body>

</html>
