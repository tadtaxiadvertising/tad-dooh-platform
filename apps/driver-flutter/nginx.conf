worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    multi_accept on;
    worker_connections 2048;
    use epoll;
}

http {
    ## MIME types & logging
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;
    error_log     /dev/stderr warn;

    ## Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30;
    keepalive_requests 100;
    server_tokens      off;
    client_max_body_size 1m;

    ## Gzip compresión (estático + dinámico)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/wasm
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        application/octet-stream;

    ## Brotli (si nginx-extras está disponible)
    #brotli on;
    #brotli_comp_level 6;
    #brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    ## Cacheo de archivos estáticos (OPEN FILES CACHE)
    open_file_cache          max=1000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    ## Seguridad: headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    ## Frontend SPA server
    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root   /usr/share/nginx/html;
        index  index.html;

        # ========== Rutas de archivos inmutables (cache infinito) ==========
        location ~* \.(?:js|js\.map|wasm|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ========== Service Worker (no cache, debe revalidar) ==========
        location ~* flutter_service_worker\.js$ {
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ========== SPA fallback (todo lo demás → index.html) ==========
        location / {
            try_files $uri $uri/ /index.html;

            # No cachear el index.html en navegador (siempre check fresco)
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # ========== Denegar archivos ocultos (.env, .git, etc) ==========
        location ~ /\. {
            deny all;
            return 404;
        }

        # ========== Error pages ==========
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}