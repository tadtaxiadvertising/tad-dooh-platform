name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build Docker Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: admin
            dockerfile: Dockerfile.admin
          - image: driver
            dockerfile: Dockerfile.driver
          - image: player
            dockerfile: Dockerfile.player
    steps:
      - uses: actions/checkout@v5

      - name: Inspect runner disk
        run: |
          df -h
          docker system df

      - name: Build canonical Docker image
        run: docker build . --file "${{ matrix.dockerfile }}" --tag "tad-${{ matrix.image }}:test"
