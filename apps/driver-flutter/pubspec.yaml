name: tad_driver
description: TAD Driver Flutter app (replica of the Kotlin driver app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^19.5.0
  flutter_map: ^8.3.1
  google_fonts: ^6.2.1
  latlong2: ^0.10.1
  permission_handler: ^12.0.3
  sembast: ^3.8.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
