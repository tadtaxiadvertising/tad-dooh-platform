name: Generate Combined Security Lock (temporary)
on:
  push:
    branches:
      - integration/security-audit-patches-20261103
    paths:
      - ".github/workflows/security-integration-lock-generator.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-combined-lock:
    if: github.repository == 'tadtaxiadvertising/tad-dooh-platform' && github.ref == 'refs/heads/integration/security-audit-patches-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile dependency graph using pnpm only
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify both fixes are resolved together
        run: |
          set -euo pipefail
          node --test scripts/security-compatible-transitives.test.cjs
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8');
          const api = require('./apps/api/package.json');
          if (api.dependencies.nodemailer !== '^10.3.1') process.exit(1);
          if (!lock.includes('\n  nodemailer@10.3.1:')) process.exit(1);
          if (lock.includes('\n  nodemailer@8.0.11:')) process.exit(1);
          NODE
      - name: Commit only combined generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already combined"
            exit 0
          fi
          git commit -m "chore(security): regenerate combined audit fixes lock [pnpm]"
          git push origin HEAD:integration/security-audit-patches-20261103
