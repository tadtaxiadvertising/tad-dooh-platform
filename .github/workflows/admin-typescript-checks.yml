name: Admin TypeScript Focused Gates

on:
  pull_request:
    paths:
      - "apps/admin/components/MapView.tsx"
      - "apps/admin/pages/api/proxy/**"
      - "apps/admin/utils/mapCoordinates.ts"
      - "scripts/admin-coordinate.test.cjs"
      - ".github/workflows/admin-typescript-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-types-and-coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coordinate and proxy regression
        run: node --test scripts/admin-coordinate.test.cjs
      - name: Admin TypeScript
        run: pnpm exec tsc --noEmit --project apps/admin/tsconfig.json
