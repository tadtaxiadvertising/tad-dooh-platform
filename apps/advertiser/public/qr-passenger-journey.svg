<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576" role="img" aria-labelledby="title desc">
<title id="title">Pasajero descubre una promoción TAD con su celular</title>
<desc id="desc">Ilustración editorial de una pantalla amarilla instalada detrás del reposacabezas del copiloto, vista desde el asiento trasero de un taxi, con un pasajero levantando su teléfono hacia la promoción.</desc>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#262a24"/><stop offset=".48" stop-color="#141813"/><stop offset="1" stop-color="#080b0c"/></linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#34463c"/><stop offset="1" stop-color="#0e1a17"/></linearGradient>
  <linearGradient id="seat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3d423d"/><stop offset=".7" stop-color="#151816"/><stop offset="1" stop-color="#090b0a"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42574f"/><stop offset="1" stop-color="#0c1816"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#ffda39" stop-opacity=".32"/><stop offset="1" stop-color="#ffda39" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
