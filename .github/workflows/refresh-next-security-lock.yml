name: Refresh lockfile for Next.js security patch
# Runs only on the isolated security-fix branch; no production secrets are used.

on:
  push:
    branches:
      - fix/nextjs-security-15-5-24
    paths:
      - "apps/admin/package.json"
      - "apps/driver/package.json"
      - "apps/advertiser/package.json"
      - ".github/workflows/refresh-next-security-lock.yml"

permissions:
  contents: write

concurrency:
  group: next-security-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout security-fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/nextjs-security-15-5-24
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile pins patched Next.js
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = '15.5.24';
          const apps = ['apps/admin', 'apps/driver', 'apps/advertiser'];
          for (const app of apps) {
            const declared = lock.packages[app]?.dependencies?.next;
            if (declared !== expected) {
              throw new Error(`${app}: lockfile declares next=${declared}, expected ${expected}`);
            }
          }
          const installed = lock.packages['node_modules/next']?.version;
          if (installed !== expected) {
            throw new Error(`root lock entry resolves next=${installed}, expected ${expected}`);
          }
          console.log(`Verified workspace declarations and resolved Next.js ${installed}`);
          NODE
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for Next.js security patch [skip ci]"
          git fetch origin fix/nextjs-security-15-5-24
          git rebase origin/fix/nextjs-security-15-5-24
          git push origin HEAD:fix/nextjs-security-15-5-24
