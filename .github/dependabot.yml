# Dependabot Configuration
# ----------------------------
# Mantiene automáticamente las dependencias actualizadas.
# Calendario escalonado cada viernes: npm 09:00, Docker 10:00, Actions 11:00 UTC.
# Minor/patch rutinarios agrupados por ecosistema; seguridad conserva PRs propios.
# ULTRA-SEGURO: no actualiza versiones mayores sin revisión manual.

version: 2
updates:
  # ─── npm (pnpm) ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 4
    # Group routine weekly version upgrades to avoid repeated main pushes
    # (and potential EasyPanel GitHub auto-builds) in a short burst.
    # Security advisories remain independent, not grouped or delayed here.
    groups:
      production-version-updates:
        applies-to: version-updates
        dependency-type: production
        patterns: ["*"]
        update-types: ["minor", "patch"]
      development-version-updates:
        applies-to: version-updates
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]

    reviewers:
      - "tad-team"
    assignees:
      - "tad-team"
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    labels:
      - "dependencies"
      - "automation"
    # Evita actualizar versiones mayores (breaking changes) automáticamente
    versioning-strategy: "increase"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Skip major version updates (breaking changes)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── Docker ──────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

    reviewers:
      - "tad-team"
    commit-message:
      prefix: "chore(deps): "
      include: "scope"
    labels:
      - "dependencies"
      - "automation"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─── GitHub Actions ──────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "11:00"
    open-pull-requests-limit: 3
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

    reviewers:
      - "tad-team"
    commit-message:
      prefix: "chore(ci): "
      include: "scope"
    labels:
      - "dependencies"
      - "automation"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
