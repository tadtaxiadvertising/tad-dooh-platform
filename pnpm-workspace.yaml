packages:
  - "apps/*"
  - "packages/*"

overrides:
  'multer': 2.5.0
  'follow-redirects': 1.16.2
  '@nestjs/platform-express>body-parser': 1.20.9
  '@nestjs/platform-express>express': 4.22.3
  'express@4>body-parser': 1.20.9
  'express@5>body-parser': 2.4.0
  'next@15.5.29>postcss': 8.5.33
  '@modelcontextprotocol/sdk>@hono/node-server': 2.1.6
  '@nestjs/common>file-type': 21.3.4
  '@nestjs/cli>glob': 10.5.0
  '@angular-devkit/core>ajv': 8.20.0
  '@angular-devkit/core>picomatch': 4.0.7
  '@nestjs/config>lodash': 4.18.1
  '@nestjs/swagger>js-yaml': 4.3.2
  '@nestjs/swagger>lodash': 4.18.1
  'external-editor>tmp': 0.2.7
  '@rollup/plugin-terser>serialize-javascript': 7.1.3

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
