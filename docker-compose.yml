services:
  tad-api:
    image: nestjs-backend:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M # Optimización para VPS modesto
  tad-driver-pwa:
    image: nextjs-frontend:latest
    ports:
      - "3000:3000"
