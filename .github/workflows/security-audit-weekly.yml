name: Weekly Supabase Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  issues: write

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Security Audit
        id: audit
        # Privileged API and PostgreSQL credentials are needed ONLY here;
        # never inherit them in checkout, setup, artifact or GitHub-script.
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'REPLACE_WITH_SECRET' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail

          # Refuse missing credentials before contacting Supabase. Never print values.
          if [[ ! "${SUPABASE_PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]] ||
             [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] ||
             [[ -z "${DB_PASSWORD:-}" ]]; then
            echo "::error::Supabase security audit configuration missing or invalid."
            exit 1
          fi
          # Fail closed on a valid but WRONG Supabase project. The identifier
          # below is the independently confirmed EasyPanel API project (#217);
          # changing production requires a reviewed update to this contract.
          # A project ref is not a credential; no secret values are logged.
          AUDIT_EXPECTED_PROJECT_REF="ltdcdhqixvbpdcitthqf"
          if [[ "$SUPABASE_PROJECT_REF" != "$AUDIT_EXPECTED_PROJECT_REF" ]]; then
            echo "::error::Supabase audit target does not match approved production project."
            exit 1
          fi
          # Libpq reads the password from process environment, not argv/URI.
          export PGHOST="db.$SUPABASE_PROJECT_REF.supabase.co"
          export PGUSER="postgres" PGDATABASE="postgres" PGPORT="5432"
          export PGPASSWORD="$DB_PASSWORD"
          
          echo "=== Supabase Security Audit $(date -u) ==="
          echo "Project: $SUPABASE_PROJECT_REF"
          echo "Plan: Free (500MB DB, 1GB Storage, 500K Edge Fn, 200 Realtime)"
          echo ""
          
          # Helper: API call with error handling
          api_get() {
            # Pass the Authorization header over stdin, not process argv.
            curl -fsS --config - "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF$1" <<CURL_CONFIG
          header = "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          CURL_CONFIG
          }
          
          # 1. Security Advisories
          echo "--- 1. Security Advisories ---"
          ADVISORIES=$(api_get "/database/lints")

          # Management API errors or unexpected JSON must never count as zero
          # advisories. Keep only aggregate counts in public artifacts.
          if ! jq -e 'type == "array" and all(.[]; type == "object" and (.name | type == "string" and length > 0) and (.level | IN("ERROR", "WARN", "INFO")))' <<<"$ADVISORIES" >/dev/null; then
            echo "::error::Invalid Supabase security advisory response."
            exit 1
          fi

          ERROR_COUNT=$(echo "$ADVISORIES" | jq '[.[] | select(.level=="ERROR")] | length')
          WARN_COUNT=$(echo "$ADVISORIES" | jq '[.[] | select(.level=="WARN")] | length')
          INFO_COUNT=$(echo "$ADVISORIES" | jq '[.[] | select(.level=="INFO")] | length')
          
          echo "ERROR: $ERROR_COUNT | WARN: $WARN_COUNT | INFO: $INFO_COUNT"
          # Only aggregate counts may be attached to public GitHub artifacts.
          printf '{"ERROR_COUNT":%s,"WARN_COUNT":%s,"INFO_COUNT":%s}\n' "$ERROR_COUNT" "$WARN_COUNT" "$INFO_COUNT" > advisories-summary.json
          echo "$ADVISORIES" | jq -r '.[] | select(.level=="ERROR" or .level=="WARN") | "\(.level): \(.name)"'
          
          # 2. Database Size & Usage
          echo ""
          echo "--- 2. Database Size & Usage ---"
          DB_STATS=$(psql -X -v ON_ERROR_STOP=1 \
            -c "
            SELECT 
              pg_size_pretty(pg_database_size('postgres')) as total_db,
              pg_size_pretty(pg_total_relation_size('telemetry')) as telemetry,
              pg_size_pretty(pg_total_relation_size('playback_events')) as playback_events,
              (SELECT count(*) FROM pg_stat_activity WHERE datname='postgres') as active_connections,
              (SELECT setting::int FROM pg_settings WHERE name='max_connections') as max_connections;
            " -t -A)
          echo "$DB_STATS"
          
          # Check DB size threshold (400MB warning, 450MB critical on 500MB limit)
          DB_SIZE_MB=$(psql -X -v ON_ERROR_STOP=1 \
            -c "SELECT round(pg_database_size('postgres')/1024/1024) as mb;" -t -A | head -1)
          echo "Database: ${DB_SIZE_MB} MB / 500 MB limit"
          
          if [ "$DB_SIZE_MB" -gt 450 ]; then
            echo "::error::DATABASE CRITICAL: ${DB_SIZE_MB}MB > 450MB (90% of 500MB limit)"
            echo "db_critical=true" >> $GITHUB_OUTPUT
          elif [ "$DB_SIZE_MB" -gt 400 ]; then
            echo "::warning::DATABASE WARNING: ${DB_SIZE_MB}MB > 400MB (80% of 500MB limit)"
            echo "db_warning=true" >> $GITHUB_OUTPUT
          fi
          
          # 3. Storage Usage
          echo ""
          echo "--- 3. Storage Usage ---"
          STORAGE=$(api_get "/storage/buckets")
          if ! jq -e 'type == "array" and all(.[]; type == "object" and (.id | type == "string" and length > 0) and (.name | type == "string" and length > 0) and (.public | type == "boolean"))' <<<"$STORAGE" >/dev/null; then
            echo "::error::Invalid required Supabase Storage bucket response."
            exit 1
          fi
          echo "$STORAGE" | jq -r '.[] | "\(.name): \(.public // false | if . then "public" else "private" end) - \(.file_size_limit // "no limit")"'
          
          # Total storage via Management API (if available)
          STORAGE_TOTAL=$(api_get "/storage/usage" 2>/dev/null || echo '{}')
          echo "Storage usage response collected; raw metadata withheld from public logs."
          
          # 4. Auth Users & Config
          echo ""
          echo "--- 4. Auth Users & Config ---"
          AUTH_CONFIG=$(api_get "/config/auth")
          if ! jq -e 'type == "object" and (.disable_signup | type == "boolean") and (.external_email_enabled | type == "boolean")' <<<"$AUTH_CONFIG" >/dev/null; then
            echo "::error::Invalid required Supabase Auth configuration response."
            exit 1
          fi
          echo "$AUTH_CONFIG" | jq '{leaked_password_protection_enabled, password_min_length, enable_signup, mfa_enabled, jwt_expiry, session_timebox, enable_email_confirmations}'
          
          # Get user count (approximate via list with limit)
          USERS=$(api_get "/auth/users?limit=1" 2>/dev/null || echo '{}')
          echo "Auth config retrieved. User count requires pagination (skipped for speed)."
          
          # 5. Edge Functions
          echo ""
          echo "--- 5. Edge Functions ---"
          FUNCTIONS=$(api_get "/functions")
          if ! jq -e 'type == "array" and all(.[]; type == "object" and (.slug | type == "string" and length > 0) and (.name | type == "string" and length > 0))' <<<"$FUNCTIONS" >/dev/null; then
            echo "::error::Invalid required Supabase Edge Functions response."
            exit 1
          fi
          FUNC_COUNT=$(echo "$FUNCTIONS" | jq 'length')
          echo "Deployed functions: $FUNC_COUNT"
          echo "$FUNCTIONS" | jq -r '.[] | "\(.name): v\(.version // "latest") - \(.status // "unknown")"'
          
          # Edge Function invocations (last 24h via logs)
          if [ "$FUNC_COUNT" -gt 0 ]; then
            echo "Checking recent invocations..."
            for func in $(echo "$FUNCTIONS" | jq -r '.[].slug'); do
              LOGS=$(api_get "/functions/$func/logs?limit=10" 2>/dev/null || echo '[]')
              RECENT=$(echo "$LOGS" | jq '[.[] | select(.timestamp > (now - 86400))] | length')
              echo "  $func: $RECENT invocations (24h)"
            done
          fi
          
          # 6. Realtime
          echo ""
          echo "--- 6. Realtime ---"
          REALTIME=$(api_get "/realtime/usage" 2>/dev/null || echo '{}')
          echo "Realtime usage: $REALTIME"
          
          # 7. Effective public DML privileges (including inherited PUBLIC grants)
          echo ""
          echo "--- 7. RLS Deny-by-Default Check ---"
          GRANT_COUNT=$(psql -X -v ON_ERROR_STOP=1 \
            -c "SELECT count(*)::integer
            FROM pg_catalog.pg_class c
            JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind IN ('r','p','v','m','f')
              AND EXISTS (
                SELECT 1
                FROM (VALUES ('anon'), ('authenticated')) AS roles(role_name)
                CROSS JOIN (VALUES ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE')) AS perms(privilege)
                WHERE pg_catalog.has_table_privilege(roles.role_name, c.oid, perms.privilege)
              );" \
            -t -A | head -1)
          if ! [[ "$GRANT_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid effective PostgreSQL client-grant count."
            exit 1
          fi
          echo "Public relations with effective anon/authenticated DML access: $GRANT_COUNT"
          
          # 8. Function search_path (mutable check)
          echo ""
          echo "--- 8. Function search_path (mutable check) ---"
          MUTABLE_FUNCS=$(psql -X -v ON_ERROR_STOP=1 \
            -c "
            SELECT count(*) FROM pg_proc p
            JOIN pg_namespace n ON p.pronamespace = n.oid
            WHERE n.nspname = 'public'
              AND (p.proconfig IS NULL OR NOT p.proconfig @> ARRAY['search_path=pg_catalog,public']);
            " -t -A | head -1)
          echo "Functions with mutable search_path: $MUTABLE_FUNCS"
          
          # 9. st_estimatedextent Permissions
          echo ""
          echo "--- 9. st_estimatedextent Permissions ---"
          psql -X -v ON_ERROR_STOP=1 \
            -c "
            SELECT 
              p.proname,
              pg_get_function_identity_arguments(p.oid) as args,
              has_function_privilege('anon', p.oid, 'EXECUTE') as anon_exec,
              has_function_privilege('authenticated', p.oid, 'EXECUTE') as auth_exec
            FROM pg_proc p
            JOIN pg_namespace n ON p.pronamespace = n.oid
            WHERE n.nspname = 'public' AND p.proname = 'st_estimatedextent';
            "
          
          # 10. Long-idle transactions. pg_stat_activity is a live
          # activity view, NOT an error log (it has no log_time column).
          echo ""
          echo "--- 10. Idle transactions over 5 minutes ---"
          IDLE_TXN_COUNT=$(psql -X -v ON_ERROR_STOP=1 \
            -c "
            SELECT count(*)::integer
            FROM pg_catalog.pg_stat_activity
            WHERE datname = current_database()
              AND state = 'idle in transaction'
              AND state_change < now() - interval '5 minutes';
            " -t -A | head -1)
          if ! [[ "$IDLE_TXN_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid idle-transaction count from PostgreSQL."
            exit 1
          fi
          echo "Idle transactions older than five minutes: $IDLE_TXN_COUNT"
          if [ "$IDLE_TXN_COUNT" -gt 0 ]; then
            echo "::warning::Long-idle transactions detected ($IDLE_TXN_COUNT)."
          fi
          
          # Long-running queries
          psql -X -v ON_ERROR_STOP=1 \
            -c "
            SELECT count(*) AS active_queries_over_30_seconds
            FROM pg_stat_activity
            WHERE (now() - query_start) > interval '30 seconds'
              AND state = 'active';
            " 2>/dev/null || echo "Long query check skipped"
          
          # 11. Determine overall status
          echo ""
          echo "=== AUDIT RESULT ==="
          
          # Fail on new ERRORs (excluding known blocked ones)
          # Do not suppress every RLS-disabled table by lint name.
          # The only legacy exception is the exact extension-managed object;
          # missing/unknown metadata fails closed and remains a NEW_ERROR.
          KNOWN_BLOCKED_ERRORS='{"name":"rls_disabled_in_public","schema":"public","table":"spatial_ref_sys"}'
          NEW_ERRORS=$(echo "$ADVISORIES" | jq --argjson known "$KNOWN_BLOCKED_ERRORS" \
            '[.[] | select(.level=="ERROR" and ((.name == $known.name and .metadata.schema == $known.schema and .metadata.name == $known.table) | not))]')
          NEW_ERROR_COUNT=$(echo "$NEW_ERRORS" | jq 'length')
          
          if [ "$NEW_ERROR_COUNT" -gt 0 ]; then
            echo "::error::NEW SECURITY ERRORS DETECTED ($NEW_ERROR_COUNT)"
            echo "$NEW_ERRORS" | jq -r '.[] | "ERROR: \(.name)"'
            echo "new_errors=true" >> $GITHUB_OUTPUT
          fi
          
          # Warn on new WARNs (excluding known)
          KNOWN_WARNS='["extension_in_public","anon_security_definer_function_executable","authenticated_security_definer_function_executable"]'
          NEW_WARNS=$(echo "$ADVISORIES" | jq --argjson known "$KNOWN_WARNS" \
            '[.[] | select(.level=="WARN" and ((.name | IN($known[])) | not))]')
          NEW_WARN_COUNT=$(echo "$NEW_WARNS" | jq 'length')
          
          if [ "$NEW_WARN_COUNT" -gt 0 ]; then
            echo "::warning::NEW WARNINGS DETECTED ($NEW_WARN_COUNT)"
            echo "$NEW_WARNS" | jq -r '.[] | "WARN: \(.name)"'
          fi
          
          # Fail if grants found
          if [ "$GRANT_COUNT" -gt 0 ]; then
            echo "::error::GRANTS TO ANON/AUTHENTICATED FOUND ($GRANT_COUNT)"
            echo "new_grants=true" >> $GITHUB_OUTPUT
          fi
          
          # Fail if mutable functions found
          if [ "$MUTABLE_FUNCS" -gt 0 ]; then
            echo "::error::MUTABLE SEARCH_PATH FUNCTIONS FOUND ($MUTABLE_FUNCS)"
            echo "mutable_funcs=true" >> $GITHUB_OUTPUT
          fi
          
          # The GITHUB_OUTPUT file does NOT set variables in this Bash process.
          # Fail closed using the actual counters, never ${new_errors:-false}
          # or other undefined local flags. Keep output flags for issue reporting.
          if [ "$NEW_ERROR_COUNT" -gt 0 ] ||
             [ "$GRANT_COUNT" -gt 0 ] ||
             [ "$MUTABLE_FUNCS" -gt 0 ] ||
             [ "${DB_SIZE_MB:-0}" -gt 450 ]; then
            echo "::error::Weekly Supabase audit failed one or more security checks."
            exit 1
          fi
          
          echo "All checks passed. No new security regressions."
          echo "new_errors=false" >> $GITHUB_OUTPUT
          echo "new_grants=false" >> $GITHUB_OUTPUT
          echo "mutable_funcs=false" >> $GITHUB_OUTPUT
          echo "db_critical=false" >> $GITHUB_OUTPUT

      - name: Upload advisories artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-advisories-${{ github.run_id }}
          path: advisories-summary.json
          retention-days: 30

      - name: Create GitHub Issue on failure
        # Preflight, Management API, PostgreSQL and upload failures must be
        # reported too; audit step outputs may not exist after an early error.
        if: failure()
        uses: actions/github-script@v7
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_NEW_ERRORS: ${{ steps.audit.outputs.new_errors }}
          AUDIT_NEW_GRANTS: ${{ steps.audit.outputs.new_grants }}
          AUDIT_MUTABLE_FUNCS: ${{ steps.audit.outputs.mutable_funcs }}
          AUDIT_DB_CRITICAL: ${{ steps.audit.outputs.db_critical }}
        with:
          script: |
            const fs = require('fs');
            // Raw advisories, SQL, URLs, and credentials must never go to
            // issues. The summary is optional when audit failed early.
            let counts = null;
            try {
              if (fs.existsSync('./advisories-summary.json')) {
                const parsed = JSON.parse(fs.readFileSync('./advisories-summary.json', 'utf8'));
                const names = ['ERROR_COUNT', 'WARN_COUNT', 'INFO_COUNT'];
                if (names.every(key => Number.isSafeInteger(parsed[key]) && parsed[key] >= 0)) {
                  counts = Object.fromEntries(names.map(key => [key, parsed[key]]));
                }
              }
            } catch {
              counts = null;
            }

            const flags = [
              ['AUDIT_NEW_ERRORS', 'New security ERRORs detected'],
              ['AUDIT_NEW_GRANTS', 'Client-role table grants detected'],
              ['AUDIT_MUTABLE_FUNCS', 'Mutable function search_path detected'],
              ['AUDIT_DB_CRITICAL', 'Database size critical'],
            ];
            const findings = flags.filter(([key]) => process.env[key] === 'true')
              .map(([, reason]) => reason);
            if (findings.length === 0) {
              findings.push(process.env.AUDIT_OUTCOME === 'failure'
                ? 'Audit interrupted or failed before findings were available'
                : 'Workflow failed in setup, artifact upload, or another step');
            }
            const countSummary = counts
              ? 'ERROR: ' + counts.ERROR_COUNT + ', WARN: ' + counts.WARN_COUNT +
                ', INFO: ' + counts.INFO_COUNT
              : 'Unavailable (audit may have failed before creating summary)';
            const body = [
              '**Weekly Supabase Security Audit failed.**',
              'Run: ' + context.runId,
              'Timestamp (UTC): ' + new Date().toISOString(),
              'Findings:',
              ...findings.map(reason => '- ' + reason),
              'Aggregate advisory counts: ' + countSummary,
              'Inspect the restricted Actions run for diagnosis; do not paste secrets or raw SQL.',
            ].join('\n');
            // Avoid optional assignees/labels blocking issue creation if the
            // actor is a bot or the repository has no matching labels.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security Audit Failed - run ' + context.runId,
              body,
            });

      - name: Slack Notification on failure
        if: failure()
        # The Slack webhook is a credential; only this notification receives it.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🔴 *Security Audit Failed* for TAD DOOH\nProject: \`ltdcdhqixvbpdcitthqf\`\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>\nCheck GitHub Actions for details.\"}" \
            --config - <<CURL_CONFIG
          url = "$SLACK_WEBHOOK_URL"
          CURL_CONFIG

      - name: Slack Notification on success
        if: success()
        # The Slack webhook is a credential; only this notification receives it.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ *Security Audit Passed* for TAD DOOH\nProject: \`ltdcdhqixvbpdcitthqf\`\nNo new security regressions.\"}" \
            --config - <<CURL_CONFIG
          url = "$SLACK_WEBHOOK_URL"
          CURL_CONFIG