name: tad_driver
description: TAD Driver Flutter app (official driver service — offline-first, Riverpod, Isar, Supabase realtime).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  supabase_flutter: ^2.8.0
  path_provider: ^2.1.5
  geolocator_plus: ^14.1.0
  flutter_local_notifications: ^19.5.0
  connectivity_plus: ^6.1.3
  permission_handler: ^12.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.2
  riverpod_annotation: ^2.6.1
  go_router: ^14.7.2
  flutter_dotenv: ^5.2.1
  isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  file_picker: ^8.1.7
  mobile_scanner: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  # isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tad_launch.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "tad_launch.png"
  android: true
  ios: true
