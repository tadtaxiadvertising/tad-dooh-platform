name: Temporary pnpm lockfile regeneration evidence

on:
  pull_request:
    paths:
      - "pnpm-workspace.yaml"
      - "packages/ui/package.json"
      - ".github/workflows/lockfile-regen-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile using pnpm (read-only GitHub token)
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          echo 'TAD_BEGIN_PNPM_GENERATED_DIFF'
          git diff --no-ext-diff --unified=3 -- pnpm-lock.yaml
          echo 'TAD_END_PNPM_GENERATED_DIFF'
          test -n "$(git diff -- pnpm-lock.yaml)"
