server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable access logs for health checks to keep logs clean
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

    # ── 1. Easypanel liveness probe ───────────────────────────────────────────
    location /health {
        access_log off;
        add_header Content-Type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"OK","service":"tad-player","type":"vite-spa"}';
    }

    # ── 2. Vite build assets (hashed filenames → long cache) ─────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 3. SPA fallback — all routes served by index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── 4. Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Compress text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
