name: Generate Tmp Security Lock (temporary)
on:
  push:
    branches:
      - security/tmp-external-editor-20261103
    paths:
      - "package.json"
      - ".github/workflows/tmp-security-lock-generator.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve-lock:
    if: github.repository == 'tadtaxiadvertising/tad-dooh-platform' && github.ref == 'refs/heads/security/tmp-external-editor-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched transitive tmp with pnpm
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Ensure regenerated lock contains patched tmp
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const lock=fs.readFileSync('pnpm-lock.yaml','utf8');
          if (!lock.includes('\n  tmp@0.2.6:') || lock.includes('\n  tmp@0.0.33:')) process.exit(1);
          NODE
      - name: Commit only generated lockfile on isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(security): resolve tmp 0.2.6 in Nest CLI editor chain"
          git push origin HEAD:security/tmp-external-editor-20261103
