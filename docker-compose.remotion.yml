services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
          # Cambiar por tu dominio en EasyPanel (sin https://)
          # Servicios del proyecto (sin tad-remotion): admin, advertiser, driver, player, api

volumes:
  caddy_data:
  caddy_config:
