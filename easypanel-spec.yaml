# easypanel-spec.yaml
# TAD DOOH PLATFORM - CONFIGURACIÓN DE PRODUCCIÓN v10.1.0
services:
  tad-api:
    image: node:20-alpine
    deploy:
      resources:
        limits:
          memory: 1024M
    env:
      - NODE_OPTIONS="--max-old-space-size=850"
      - DATABASE_URL="postgresql://...:6543/postgres?connection_limit=5" # Prisma Pooler
      - REDIS_URL="redis://tad-redis:6379" # BullMQ Persistence
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 150s

  tad-redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - tad-redis-data:/data

volumes:
  tad-redis-data:
