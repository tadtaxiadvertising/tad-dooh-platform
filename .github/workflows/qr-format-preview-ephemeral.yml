name: TAD QR format preview (temporary)

on:
  push:
    branches:
      - fix/advertiser-qr-safe-temporary-redirect-20261123

permissions:
  contents: read

jobs:
  suggest-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.34.9
      - name: Show proposed Prettier changes (no commits or credentials)
        run: |
          set -euo pipefail
          pnpm dlx prettier@3.9.10 --write apps/api/src/modules/analytics/analytics-qr-redirect.spec.ts
          git diff -- apps/api/src/modules/analytics/analytics-qr-redirect.spec.ts
